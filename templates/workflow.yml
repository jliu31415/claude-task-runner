# Generated by `submit-task init` (github.com/@RUNNER_SLUG@). To upgrade the runner, update the
# pinned commit below, or delete this file and rerun init from a newer runner checkout.
name: claude-task
run-name: Claude task ${{ inputs.task_id }}

on:
  workflow_dispatch:
    inputs:
      snapshot_ref:
        description: Temporary branch holding the submitted snapshot (agent-snapshots/<task-id>)
        type: string
        required: true
      snapshot_sha:
        description: Expected snapshot commit
        type: string
        required: true
      prompt_path:
        description: Repo-relative Markdown prompt path inside the snapshot
        type: string
        required: true
      task_name:
        description: Task name ([a-z0-9-])
        type: string
        required: true
      task_id:
        description: Unique task ID (<task_name>-<6 hex>)
        type: string
        required: true

permissions: {}

jobs:
  task:
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: @RUNNER_SLUG@/.github/workflows/claude-task-run.yml@@RUNNER_SHA@ # @RUNNER_VERSION@
    with:
      snapshot_ref: ${{ inputs.snapshot_ref }}
      snapshot_sha: ${{ inputs.snapshot_sha }}
      prompt_path: ${{ inputs.prompt_path }}
      task_name: ${{ inputs.task_name }}
      task_id: ${{ inputs.task_id }}
    secrets:
      # not needed with workload identity federation (.claude-task/config)
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # optional: GH_TOKEN for the setup script, e.g. to read private release assets; either a
      # token, or a GitHub App key with SETUP_GH_APP_CLIENT_ID in .claude-task/config
      SETUP_GH_TOKEN: ${{ secrets.SETUP_GH_TOKEN }}
      SETUP_GH_APP_KEY: ${{ secrets.SETUP_GH_APP_KEY }}
      # optional: SETUP_ENV for the setup script, e.g. KEY=value lines it writes to a gitignored
      # env file the project needs at runtime
      SETUP_ENV: ${{ secrets.SETUP_ENV }}
